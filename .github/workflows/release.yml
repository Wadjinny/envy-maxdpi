name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish as a release (e.g. v0.1.0). Leave empty for a plain build.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name APK
        run: |
          VERSION="${TAG:-$(git rev-parse --short HEAD)}"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/envy-maxdpi-${VERSION}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envy-maxdpi-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/*.apk -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
